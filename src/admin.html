<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZAM — редактор сайта</title><style>
*{box-sizing:border-box}body{font:15px/1.5 system-ui;margin:0;background:#f5f3ee;color:#222}header{padding:22px 30px;background:#20221d;color:white;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header strong{margin-right:auto;font:28px Georgia}button,select,input,textarea{font:inherit}button{cursor:pointer;padding:10px 15px;border:1px solid #bcbdb3;background:white;color:#222}button:hover{background:#e8e9df}button.primary{background:#d9e1bd}a{color:inherit}aside{padding:25px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid #ccc}aside button.active{background:#25271f;color:white}main{max-width:1100px;padding:25px;margin:auto}#status{padding:12px 25px;margin:0;background:#e6e5dc}#status.error{background:#ffd7cc}article{padding:25px;margin-bottom:20px;background:white;border:1px solid #d6d6cc}article h2{font:26px Georgia;margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:flex;flex-direction:column;gap:7px;font-size:13px}input,textarea,select{width:100%;padding:10px;border:1px solid #b9bab0;background:#fff;color:#222}textarea{min-height:110px;resize:vertical}label.wide{grid-column:1/-1}.actions{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}img.thumb{width:90px;height:110px;object-fit:cover;margin:12px 0}.check{display:flex;flex-direction:row;align-items:center}.check input{width:auto}.help{color:#65665a;font-size:13px}.collection-title{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}.upload{padding:20px;border:1px dashed #aaa;margin-bottom:25px}.upload input{max-width:350px}button:disabled{opacity:.5;cursor:wait}@media(max-width:650px){.fields{grid-template-columns:1fr}header,aside,main{padding:16px}article{padding:15px}header strong{width:100%}}
</style><header><strong>ZAM / Редактор</strong><a href="/" target="_blank">Открыть предпросмотр ↗</a><button id="save" class="primary">Сохранить локально</button><button id="publish">Опубликовать на сайте</button></header><p id="status" role="status">Открываю редактор…</p><aside id="tabs"></aside><main id="content"></main><script>
let token=location.hash.slice(1)||sessionStorage.getItem('zam-editor-token')||'';if(token){sessionStorage.setItem('zam-editor-token',token);history.replaceState(null,'',location.pathname);}let data,manifest,revision,section='settings',dirty=false;
const status=(text,error=false)=>{const el=document.querySelector('#status');el.textContent=text;el.classList.toggle('error',error);};
const titles={settings:'Контакты и настройки',photos:'Фотографии',projects:'Проекты',services:'Услуги и цены',publications:'Публикации',testimonials:'Отзывы',journal:'Журнал',faq:'Вопросы'};
const names={formEnabled:'Форма активирована и проверена — разрешить отправку',priceMode:'Формат цены',cta:'Кнопка заявки',faq:'Вопросы об этой услуге',name:'Имя / название',mark:'Логотип',domain:'Домен (https://...)',email:'Email',phone:'Телефон (например +1 424 844 7381)',instagram:'Ссылка Instagram',location:'Локация',analyticsId:'Google Analytics ID (необязательно)',about:'Текст обо мне',heroImage:'Фото на первом экране (пусто — обложка проекта)',heroProject:'Проект первого экрана (пусто — первый опубликованный)',portraitImage:'Ваш портрет (необязательно)',id:'Идентификатор',image:'Фотография',title:'Название',category:'Категория',alt:'Описание фотографии для доступности',slug:'Адрес страницы (латиницей через дефис)',cover:'Обложка',photos:'Фотографии проекта — порядок задаётся списком ID, по одному на строку',description:'Описание',credits:'Команда / авторы (каждый с новой строки)',year:'Год (можно оставить пустым)',published:'Опубликовано',seoTitle:'Заголовок для поисковиков',heading:'Заголовок страницы',subtitle:'Подзаголовок',priceApproved:'Цена утверждена владельцем — показывать на сайте',approved:'Реальный отзыв, подтверждённый владельцем',showJournalInNav:'Показывать Journal в меню (от 3 опубликованных статей)',price:'Утверждённая цена (если есть)',duration:'Продолжительность',looks:'Образы',images:'Количество готовых фотографий',turnaround:'Срок готовности',extraImages:'Дополнительные изображения / условия',audiences:'Для кого (каждый пункт с новой строки)',included:'Что входит (каждый пункт с новой строки)',process:'Этапы (каждый с новой строки)',issue:'Номер выпуска',url:'Ссылка на публикацию',type:'Тип съёмки',quote:'Отзыв',date:'Дата (ГГГГ-ММ-ДД)',excerpt:'Краткое описание',body:'Текст статьи (пустая строка между абзацами)',question:'Вопрос',answer:'Ответ'};
const categories={portrait:'Portrait',editorial:'Fashion & Editorial',headshots:'Headshots',branding:'Personal Branding',personal:'Personal Work',commercial:'Commercial'};
const arrays=['photos','credits','audiences','included','process'];const long=['about','description','quote','body','answer','excerpt'];
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
async function api(path,payload){const response=await fetch('/api/'+path,{method:payload?'POST':'GET',headers:{Authorization:'Bearer '+token,...(payload?{'Content-Type':'application/json'}:{})},body:payload?JSON.stringify({...payload,revision}):undefined});const result=await response.json();if(!response.ok)throw Error(result.error||'Ошибка');return result;}
function markDirty(){dirty=true;status('Есть изменения. Сохраните, чтобы увидеть их в предпросмотре.');}
function field(obj,key){const label=node('label',names[key]||key);let input;const value=obj[key];
 if(key==='faq'&&Array.isArray(value)){label.className='wide';for(const item of value){label.append(field(item,'question'),field(item,'answer'));}return label;}
 if(key==='priceMode'){input=node('select');for(const[v,text]of Object.entries({starting:'Starting at',fixed:'Фиксированная цена',custom:'Custom pricing',quote:'Request a Quote'})){const o=node('option',text);o.value=v;input.append(o);}input.value=value;}
 else if(typeof value==='boolean'){label.className='check';input=node('input');input.type='checkbox';input.checked=value;}
 else if(key==='heroProject'){input=node('select');const blank=node('option','— Первый опубликованный проект —');blank.value='';input.append(blank);for(const p of data.projects.filter(p=>p.published!==false)){const option=node('option',p.title);option.value=p.slug;input.append(option);}input.value=value;}
 else if(key==='category'){input=node('select');const opts=section==='journal'?{[value]:value,'Creative process':'Creative process','Behind the scenes':'Behind the scenes','Photography notes':'Photography notes'}:categories;for(const [v,t]of Object.entries(opts)){const o=node('option',t);o.value=v;input.append(o);}input.value=value;}
 else if(['cover','portraitImage','heroImage'].includes(key)||(key==='image'&&section!=='photos')){input=node('select');const blank=node('option','— Без фотографии —');blank.value='';input.append(blank);for(const p of data.photos){const o=node('option',p.title+' ['+p.id+']');o.value=p.id;input.append(o);}input.value=value;}
 else if(arrays.includes(key)||long.includes(key)){input=node('textarea');input.value=Array.isArray(value)?value.join('\n'):value;label.className='wide';}
 else{input=node('input');input.value=value;input.type=key==='date'?'date':'text';if(key==='id'||(key==='image'&&section==='photos'))input.readOnly=true;}
 input.addEventListener('input',()=>{obj[key]=typeof value==='boolean'?input.checked:arrays.includes(key)?input.value.split('\n').map(v=>v.trim()).filter(Boolean):input.value;markDirty();});label.append(input);return label;
}
function blank(){const stamp=Date.now().toString(36);if(section==='projects')return{slug:'new-project-'+stamp,title:'Новый проект',category:'editorial',location:'',year:'',cover:data.photos[0]?.id||'',photos:[],description:'',credits:[],published:false};if(section==='publications')return{id:'publication-'+stamp,name:'Новая публикация',image:'',issue:'',year:'',url:'',published:false};if(section==='testimonials')return{id:'review-'+stamp,name:'',type:'',category:'portrait',quote:'',approved:false,published:false};if(section==='journal')return{slug:'new-story-'+stamp,title:'Новая статья',category:'Creative process',date:'',image:'',excerpt:'',body:'',published:false};if(section==='faq')return{question:'',answer:''};return null;}
function render(){const tabs=document.querySelector('#tabs');tabs.replaceChildren();for(const[k,t]of Object.entries(titles)){const b=node('button',t,k===section?'active':'');b.onclick=()=>{section=k;render();};tabs.append(b);}const main=document.querySelector('#content');main.replaceChildren();const heading=node('div',undefined,'collection-title');heading.append(node('h1',titles[section]));if(!['settings','photos','services'].includes(section)){const add=node('button','+ Добавить');add.onclick=()=>{data[section].push(blank());markDirty();render();};heading.append(add);}main.append(heading);
 if(section==='settings')main.append(node('p','Редактор работает только на этом компьютере. «Сохранить локально» обновляет предпросмотр. «Опубликовать» отправляет изменения в ваш существующий репозиторий GitHub.','help'));
 if(section==='photos'){const box=node('div',undefined,'upload');box.append(node('p','Добавить оригинальную фотографию (JPEG, PNG, WebP, до 16 МБ). Сжатые версии создаются автоматически.'));const file=node('input');file.type='file';file.accept='image/jpeg,image/png,image/webp';file.onchange=async()=>{if(!file.files[0])return;try{await save();status('Оптимизирую фотографию…');const chosen=file.files[0];if(chosen.size>16000000)throw Error('Максимум 16 МБ');const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(chosen);});const result=await api('upload',{base64,title:chosen.name.replace(/\.[^.]+$/,'')});({data,manifest,revision}=result);dirty=false;render();status('Фотография добавлена. Укажите название, категорию и описание.');}catch(e){status(e.message,true);}};box.append(file);main.append(box);}
 const entries=section==='settings'?[data.settings]:data[section];entries.forEach((obj,index)=>{const card=node('article');card.append(node('h2',section==='settings'?'Daria Zamorskaia':`${index+1}. ${obj.title||obj.name||obj.question||'Новая запись'}`));const photo=section==='photos'?obj:data.photos.find(p=>p.id===(obj.cover||obj.image));if(photo&&manifest[photo.image]){const im=node('img',undefined,'thumb');im.src=manifest[photo.image].variants[0].src;im.alt=photo.alt||'';card.append(im);}const fields=node('div',undefined,'fields');for(const key of Object.keys(obj))if(!(section==='projects'&&key==='photos'))fields.append(field(obj,key));card.append(fields);
 if(section==='projects'){const order=node('div');obj.photos.forEach((id,photoIndex)=>{const row=node('div',undefined,'actions');row.append(node('span',(photoIndex+1)+'. '+(data.photos.find(p=>p.id===id)?.title||id)));for(const [delta,label]of [[-1,'↑'],[1,'↓']]){const b=node('button',label);b.disabled=photoIndex+delta<0||photoIndex+delta>=obj.photos.length;b.onclick=()=>{[obj.photos[photoIndex],obj.photos[photoIndex+delta]]=[obj.photos[photoIndex+delta],obj.photos[photoIndex]];markDirty();render();};row.append(b);}const remove=node('button','Убрать из проекта');remove.onclick=()=>{obj.photos.splice(photoIndex,1);markDirty();render();};row.append(remove);order.append(row);});card.append(order);const picker=node('div',undefined,'actions');picker.append(node('span','Добавить в проект:'));const select=node('select');for(const p of data.photos){const opt=node('option',p.title);opt.value=p.id;select.append(opt);}const addPhoto=node('button','Добавить фото');addPhoto.onclick=()=>{if(!obj.photos.includes(select.value))obj.photos.push(select.value);markDirty();render();};picker.append(select,addPhoto);card.append(picker);}
 if(section!=='settings'){const actions=node('div',undefined,'actions');for(const[delta,text]of [[-1,'↑ Выше'],[1,'↓ Ниже']]){const b=node('button',text);b.disabled=index+delta<0||index+delta>=entries.length;b.onclick=()=>{[entries[index],entries[index+delta]]=[entries[index+delta],entries[index]];markDirty();render();};actions.append(b);}if(section!=='services'){const del=node('button','Удалить');del.onclick=()=>{if(section==='photos'){const used=data.projects.some(p=>p.cover===obj.id||p.photos.includes(obj.id))||[...data.services,...data.publications,...data.journal].some(p=>p.image===obj.id)||data.settings.portraitImage===obj.id||data.settings.heroImage===obj.id;if(used)return status('Сначала уберите это фото из проектов, услуг, публикаций или статей.',true);}if(confirm('Удалить эту запись? Изменение появится на сайте после публикации.')){entries.splice(index,1);markDirty();render();}};actions.append(del);}card.append(actions);}main.append(card);});
}
async function save(){if(!dirty)return;const result=await api('save',{data});revision=result.revision;dirty=false;status('Сохранено. Можно открыть предпросмотр.');}
document.querySelector('#save').onclick=async()=>{try{await save();status('Сохранено локально. Сайт в интернете пока не изменился.');}catch(e){status(e.message,true);}};
document.querySelector('#publish').onclick=async()=>{if(!confirm('Опубликовать текущие изменения на dariazamorskaia.com?'))return;const b=document.querySelector('#publish');b.disabled=true;try{await save();status('Публикую в GitHub…');const result=await api('publish',{confirm:true});status('Отправлено в GitHub. Обновление сайта может занять несколько минут.');}catch(e){status('Не удалось опубликовать: '+e.message,true);}finally{b.disabled=false;}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
(async()=>{try{({data,manifest,revision}=await api('content'));render();status('Редактор готов. Публичный сайт изменится только после публикации.');}catch(e){status(e.message,true);}})();
</script></html>
